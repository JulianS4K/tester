- uid: community-target-eoy-checkpoint-roots-not-a-finished-communi-2026-12-20
  summary: 🎯 COMMUNITY TARGET — EOY checkpoint (roots, not a finished community)
  start: '2026-12-20T11:00:00-05:00'
  end: '2026-12-20T12:00:00-05:00'
  timezone: America/New_York
  all_day: false
  description: 'COMMUNITY TARGET — end of year checkpoint.


    THE GOAL (realistic version): not a finished community — ROOTS. By EOY, the target is:

    - 3+ people across boxing/improv/neighborhood who know your name and would notice if you vanished

    - At least 1 "outside the structure" hang — someone you met at a recurring thing who you saw one-on-one
    (a beer after boxing, running lines with an improv person, a drink with a Sycamore regular)

    - 1 potential wingman identified — someone warm you''d actually bring to a mixer


    THE MECHANISM (this is the whole thing): show up to the SAME things REPEATEDLY. Community isn''t found,
    it accretes. The magic isn''t event #1, it''s event #8 — when familiarity turns into friendship.


    YOUR STRUCTURES (all live by end of Sep):

    - Boxing — Tuesdays, Church St (from Sep 29)

    - Improv Level 2 — Mondays, Magnet (from Sep 28), ends in a graduation show = built-in cohort

    - Vinyl Night — 2nd Weds, Sycamore

    - Neighborhood regular — the Cortelyou block (Artery / Bad Therapy / Sycamore / Highbury)


    THE RULES:

    1. Consistency over variety. Same night, same place, every week. Don''t skip to chase a one-off show.

    2. Learn names. Actually. Repeat them back.

    3. Convert: once someone''s familiar, make the outside-the-structure ask ("beer after?"). That''s
    how a face becomes a friend.

    4. The improv graduation show is your single best shot — a cohort that ends in a shared performance.
    Lean in hard.


    CHECK-IN: review this honestly at EOY. Did the roots take? Adjust for Q1 2027.'
  reminders:
  - method: popup
    minutes: 0
