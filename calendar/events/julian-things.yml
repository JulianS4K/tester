  description: 'THIRD PLACE #1 — the bar. Goal: become a regular at ONE spot through repetition. One beer,
    that''s the rule — here to be a familiar face, not to drink or grind. Nurse it, talk to the bartender,
    be present, leave.


    PICKS (all within 20-min walk — commit to whichever crowd fits):

    - HINTERLANDS (739 Church Ave): CLOSEST + best vibe-match. Nerdy/metal-friendly bar — RPG stuff on
    the walls, owner chats metal + fitness. Open till 4am. Your people, walkable. Strong rec for YOU specifically.

    - The Crown Inn (724 Franklin): open till 4am, real regulars, chat-in-it, backyard. Franklin = singles-density
    corridor.

    - The Double Windsor (210 Prospect Park W): 4.5, till 2am, excellent Park Slope neighborhood pub,
    great food.

