- uid: pre-mixer-game-plan-read-this-before-sparkle-tonight-2026-10-01
  summary: Pre-mixer game plan (read this before Sparkle tonight)
  start: '2026-10-01T18:00:00-04:00'
  end: '2026-10-01T18:15:00-04:00'
  timezone: America/New_York
  all_day: false
  description: 'PRE-MIXER GAME PLAN — read before you walk in.


    THE ONE JOB TONIGHT: leave with at least one number. Not a connection, not a soulmate. A number. That''s
    the whole win condition.


    YOUR PATTERN (name it so you beat it): you hover, have real convos, then leave without asking. The
    conversation isn''t the problem — you''re good at that. The ASK is the problem. Fix the ask, fix the
    night.


    THE 3 RULES:

    1. THE ASK IS WARM, NOT COLD. You already talked to her. Getting the number isn''t hitting on a stranger
    — it''s just not letting a good thing evaporate. You''re closing a loop that''s already open. Nobody
    who enjoyed talking to you is offended you want to continue it.


    2. ASK IN THE GROUP. Hot women get swarmed — you will NOT get her alone, so stop waiting for it. Say
    it in front of everyone, low-key: "I''ve loved talking to you but I know it''s a scene in here — what''s
    your number?" Asking in the open reads as confident, not needy. The swarm actually helps you: it signals
    you''re unbothered.


    3. LEAVE FIRST, ON A HIGH NOTE. Mid-convo, at a good moment: "I''m gonna go make the rounds — really
    enjoyed this, let''s swap info." Leaving first flips it: you''re the guy with somewhere to be who
    chose to ask, not the guy waiting for scraps.


    MAKE IT A RULE, NOT A DECISION: "If I have one real convo with someone I''d want to see again, I ask
    before I leave. Every time." Take the in-the-moment judgment call out of it — that''s where your head
    talks you out of it.


    The event''s only job is the number. Your actual strengths (funny in text, warm 1-on-1) come out AFTER,
    over text and on the date. Collect threads to pull later. Go.'
  reminders:
  - method: popup
    minutes: 0
