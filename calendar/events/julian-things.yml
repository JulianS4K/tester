  timezone: America/New_York
  all_day: false
  description: 'NEIGHBORHOOD SCOUTING MODE (not recurring yet). Find the venue/night/crowd that pulls
    you back, THEN make it your weekly community anchor. Two ways to do this: bar-regular OR café/daytime-regular
    (sober option — becoming a known daytime face builds the same familiarity with no bar tab).


    — CORTELYOU / FLATBUSH (5-min walk) —

    - Sycamore (1118): Trivia 2nd/4th Tue · Vinyl 2nd Wed · comedy 2nd/4th Mon · Drag Bingo 1st Wed ·
    karaoke Sat

    - Bad Therapy (1008): natural wine, jazz, movies, backyard — ALSO coffee by day

    - Brooklyn Artery (1004): Art Table 2nd Tue, shows

    - ruth (665 Flatbush): coffee shop by day / cocktail bar by night, fireplace, couches — great DAYTIME
    regular spot

    - Midwood Flats (577 Flatbush): social neighborhood bar, games, Drag Race Fridays

    - Highbury (1002): your pub


    — FRANKLIN AVE / CROWN HEIGHTS (denser, younger — better for meeting singles) —

    - The Crown Inn (724): open till 4am, chat-in-it, regulars

    - The C List (835): 4.9, warm community-bar

    - Altar (645 Sterling): cocktails by night, COFFEE by day (La Cabra beans) — daytime-regular option

    - The Canary (789): Irish pub, trivia nights


    — SOBER / LOW-ALCOHOL LANE —

    - Café-regular: become a daytime regular at ruth, Altar, or Bad Therapy — same familiarity, no drinking

    - Run club: Brooklyn Rogues Sunday Prospect Park loop (see separate scout)

    - Activity nights: trivia, vinyl, bingo — nurse one drink or a seltzer; the activity carries it


    HOW: sample a few over 6-8 weeks. Rate: did I stay? talk to anyone? come back? The swarm problem doesn''t
    exist here — it''s about becoming a KNOWN REGULAR, not cold-approaching. Once a spot pulls you back
    twice on its own, that''s your anchor — tell Claude, we make it recurring.'
