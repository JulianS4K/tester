# Events Julian deleted by hand. The scheduler will never re-propose these.
#
# WHY THIS FILE EXISTS: on 2026-09-23 five events vanished minutes after being
# created. That was read as a calendar-API defect and all five were recreated
# -- which silently put back things he had deliberately removed. It was not a
# defect. He was deleting them as they appeared.
#
# The calendar has two authors. A missing event is a DECISION until shown
# otherwise, so deletions have to be durable state, not an absence the next
# run re-fills. Google event IDs are useless for this because a re-proposal
# gets a fresh one; the key is a fingerprint of normalised title + date.

