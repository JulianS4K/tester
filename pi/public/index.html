<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Trakt TV</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="root">
    <nav id="rail" aria-label="Main">
      <div class="brand">TRAKT</div>
      <button class="rail-item focusable" data-route="home">🏠 <span>Home</span></button>
      <button class="rail-item focusable" data-route="search">🔎 <span>Search</span></button>
      <button class="rail-item focusable" data-route="stream">🎞 <span>GIF Stream</span></button>
      <button class="rail-item focusable" data-route="library">📚 <span>Library</span></button>
      <button class="rail-item focusable" data-route="settings">⚙ <span>Settings</span></button>
      <div class="rail-spacer"></div>
      <button class="rail-item focusable" id="account-item" data-route="settings">👤 <span id="account-label">Sign in</span></button>
    </nav>
    <main id="content" tabindex="-1"></main>
  </div>

  <div id="toast" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
