<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Hearth</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="clock">
        <div id="time">--:--</div>
        <div id="date">—</div>
      </div>
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="home">Home</button>
        <button class="tab" data-tab="calendar">Calendar</button>
        <button class="tab" data-tab="chores">Chores</button>
        <button class="tab" data-tab="list">Lists</button>
        <button class="tab" data-tab="meals">Meals</button>
        <button class="tab" data-tab="health">Health</button>
        <button class="tab" data-tab="news">News</button>
        <button class="tab" data-tab="subs">Subs</button>
        <button class="tab" data-tab="board">Board</button>
      </div>
      <div class="topright">
        <div id="weather" class="weather"></div>
        <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
      </div>
    </header>

    <main id="view"></main>
  </div>

  <div id="screensaver" hidden><img id="ss-img" alt="" /></div>
  <div id="modal" class="modal" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
